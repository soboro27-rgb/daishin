services:
  - type: web
    name: daishin-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daishin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: daishin-db
    databaseName: daishin
    user: daishin_user
